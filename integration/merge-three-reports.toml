source = { local = true }
cmd = [
    "duvet merge pkg1/report.json pkg2/report.json pkg3/report.json --json merged.json",
]

[[file]]
path = "pkg1/report.json"
contents = """
{
  "blob_link": "https://github.com/example/monorepo/blob/main",
  "specifications": {
    "https://example.com/spec": {
      "title": "Example Specification",
      "format": "markdown",
      "requirements": [0, 1],
      "sections": [
        {
          "id": "section-1",
          "title": "Requirements",
          "lines": ["Requirement 1", "Requirement 2"]
        }
      ]
    }
  },
  "annotations": [
    {
      "source": "pkg1/src/lib.rs",
      "target_path": "https://example.com/spec",
      "target_section": "section-1",
      "line": 10,
      "type": "SPEC",
      "level": "MUST"
    },
    {
      "source": "pkg1/src/test.rs",
      "target_path": "https://example.com/spec",
      "target_section": "section-1",
      "line": 20,
      "type": "TEST"
    }
  ],
  "statuses": {
    "0": {
      "spec": 1,
      "incomplete": 1,
      "related": [1]
    },
    "1": {
      "test": 1
    }
  },
  "refs": [
    {},
    {"spec": true, "level": "MUST"}
  ]
}
"""

