source = { local = true }
cmd = [
    "duvet merge report1.json report2.json --json merged.json",
    "cat merged.json",
]

[[file]]
path = "report1.json"
contents = """
{
  "blob_link": "https://github.com/example/repo/blob/main",
  "issue_link": "https://github.com/example/repo/issues",
  "specifications": {
    "https://example.com/spec": {
      "title": "Example Specification",
      "format": "markdown",
      "requirements": [0, 1],
      "sections": [
        {
          "id": "section-1",
          "title": "Introduction",
          "lines": ["Line 1", "Line 2"]
        }
      ]
    }
  },
  "annotations": [
    {
      "source": "src/lib.rs",
      "target_path": "https://example.com/spec",
      "target_section": "section-1",
      "line": 10,
      "type": "SPEC",
      "level": "MUST",
      "comment": "First requirement"
    },
    {
      "source": "src/utils.rs",
      "target_path": "https://example.com/spec",
      "target_section": "section-1",
      "line": 20,
      "type": "TEST",
      "comment": "Test for first requirement"
    }
  ],
  "statuses": {
    "0": {
      "spec": 1,
      "incomplete": 1,
      "related": [1]
    },
    "1": {
      "test": 1
    }
  },
  "refs": [
    {},
    {"spec": true, "level": "MUST"}
  ]
}
"""

[[file]]
path = "report2.json"
contents = """
{
  "blob_link": "https://github.com/example/repo/blob/main",
